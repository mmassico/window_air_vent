<text x="12.00" y="23.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">Print two copies at 100 % (Actual size, not Fit to page); both bars must measure 100 mm.</text>
<text x="12.00" y="28.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">Copy 1: cut along the OUTER rectangle. Lay it on the foam's room face, its left edge on the foam's end</text>
<text x="12.00" y="33.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">(the side frame's end), and trace it: that is the top edge of the three 45&#176; slopes.</text>
<text x="12.00" y="38.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">Copy 2: cut along the INNER rectangle: the notch's floor, 9.5 mm deep. Lay it in the notch to check the floor.</text>
<text x="12.00" y="43.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">Line both up in height with the notch in the assembled side cap; carve a little small, then sand to the cover.</text>
