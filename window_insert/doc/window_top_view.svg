<text x="40.0" y="1040.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">To scale: 7 px per mm in both directions. u = 0 on the foam's centre, the centre of the side frame's 25.90 channel. The caps' 3 mm bases set the sash 118 from the side frame.</text>
<text x="40.0" y="1062.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">The latch zone spans 80 mm of height (see the side view); the soft foam strip is only at the floor, 19 high; another, 1.7 thick, lies across the channel's floor, also 4.0 deep.</text>
<text x="40.0" y="1084.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">Dashed in the sash's groove: the screw heads, 3.70 high, only within 12 of the sash's top and bottom.</text>
