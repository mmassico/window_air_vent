<text x="40.0" y="50.0" font-size="22" text-anchor="start" fill="#111" font-weight="bold">Motor screw mount: section through one of the four screws (mm)</text>
<text x="40" y="770" font-size="14" fill="#333">The motor's M3 holes are 2.5 deep: through the 4 mm plate and its 2 mm boss, an M3 x 8 reaches 2 mm in (4 threads), 0.5 mm short of the bottom.</text>
<text x="40" y="794" font-size="14" fill="#333">The bosses and heads go down through the frame's diamond pockets; below the frame there is about 38 mm of empty tower.</text>
<text x="40" y="818" font-size="14" fill="#333">Screw the motor on at the bench (heads from below), then set the plate on the frame. A socket head (3 mm) would also fit.</text>
