<text x="12.00" y="15.00" font-size="6" text-anchor="start" fill="#333333" font-weight="bold">Foam insert: drilling template, full size (mm)</text>
<text x="12.00" y="23.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">Print at 100 % (Actual size, not Fit to page); both bars must measure 100 mm.</text>
<text x="12.00" y="28.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">Tape it on the foam, centred across the insert's width, INTAKE on top (it works from either face).</text>
<text x="12.00" y="33.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">Mark each centre with an awl and drill a pilot hole right through.</text>
<text x="12.00" y="38.00" font-size="3.4" text-anchor="start" fill="#333333" font-weight="normal">Cut with a 3-1/4 in (83 mm) hole saw, halfway from each face, centred on the pilot hole.</text>
