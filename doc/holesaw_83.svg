<text x="40" y="790" font-size="14" fill="#333">Listed: Ø 83 cut, 32 cutting depth, 98 arbor with its pilot drill, 68 pilot drill. Grey italic values are read from the photos or typical: measure them.</text>
<text x="40" y="814" font-size="14" fill="#333">The cut (32 deep) is shorter than the foam (51): cut from both faces, on one pilot hole, so the kerfs meet with 13 mm of overlap.</text>
<text x="40" y="838" font-size="14" fill="#333">The pilot drill may not reach through 51 mm: push a skewer or a long nail through the centre mark to find it on the other face.</text>
<text x="40" y="862" font-size="14" fill="#333">The teeth are set alternately in and out, so the hole is wider than the body: measure a test hole before trusting 83.</text>
