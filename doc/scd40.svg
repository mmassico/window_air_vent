<text x="40.0" y="50.0" font-size="22" text-anchor="start" fill="#111" font-weight="bold">SCD40 CO2 sensor module (Sensirion SCD40 on a 13.7 x 21.7 mm board), mm</text>
<text x="40.0" y="750.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">Measured: board 13.70 x 21.70 x 1.62; 7.85 from its underside to the sensor's top; pins 2.54 apart; pin 1 (GND)'s hole</text>
<text x="40.0" y="772.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">2.63 from the left edge and 1.00 from the bottom edge (edge to hole edge: centres 3.13 and 1.50). Grey italic values are estimates.</text>
<text x="40.0" y="794.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">On board: R1, R2 (10k, marked 103): the I2C pull-ups; C1: decoupling. It runs on 3.3 V here (VDD from the ESP32's 3V3).</text>
<text x="40.0" y="816.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">The controller PCB's J5 has the same order (GND, VDD, SCL, SDA): a straight 4-wire cable. Leave the membrane uncovered.</text>
