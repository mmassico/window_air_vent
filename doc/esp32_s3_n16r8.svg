<text x="40.0" y="50.0" font-size="22" text-anchor="start" fill="#111" font-weight="bold">ESP32-S3-N16R8 board (DevKitC-1 layout, U.FL antenna): top view, components up (mm)</text>
<text x="40" y="1196" font-size="14" fill="#333">Measured on the board. 2 x 22 pins, 2.54 pitch; the 20 inner pins of each row are the Freenove's (the v2.0 PCB takes both boards).</text>
<text x="40" y="1220" font-size="14" fill="#333">U.FL socket on the module, for the external antenna's pigtail (15 cm, to the SMA jack in the electronics box's wall).</text>
<text x="40" y="1244" font-size="14" fill="#333">The USB-C sockets are at the same places as on the Freenove board and are the tallest parts; nothing on the underside.</text>
<text x="40" y="1268" font-size="14" fill="#333">In the electronics box, plug the USB-UART connector, marked COM on this board (power and console).</text>
</svg>
