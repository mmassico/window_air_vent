<text x="40" y="1120" font-size="14" fill="#333">Measured on the board. 2 x 20 pins, 2.54 pitch; the rows land 10 holes apart on a perfboard (25.4, within 0.1).</text>
<text x="40" y="1144" font-size="14" fill="#333">Side view: 5.54 pins below a 2.78 spacer, 1.62 PCB; the tallest part is 4.85 above the PCB's underside, the USB-C sockets 3.25 above its top.</text>
<text x="40" y="1168" font-size="14" fill="#333">In the electronics box, the USB end faces the left wall (or the right one, board turned 180 deg); plug the USB-UART connector (power and console).</text>
