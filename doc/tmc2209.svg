<text x="40" y="790" font-size="14" fill="#333">Sizes and heights measured on the module; row spacing and pin span are the StepStick standard (0.5 in rows, 0.1 in pitch).</text>
<text x="40" y="814" font-size="14" fill="#333">Heatsink: 13.2 high with its thermal sticker, 14.70 from the PCB underside to its top once pressed on. It sits toward the DIR/GND end,</text>
<text x="40" y="838" font-size="14" fill="#333">clear of the potentiometer, with the same small gap there as at its sides; its base touches the PCB on a 10 mm strip, relieved over the pin tips.</text>
<text x="40" y="862" font-size="14" fill="#333">The chip is on the underside; its thermal pad, the heatsink side, faces up. The fins run along the pin rows.</text>
<text x="40" y="886" font-size="14" fill="#333">Thermal pad, EN pads and potentiometer positions are approximate.</text>
