<text x="40.0" y="1039.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">Grey italic values are estimates or derived. Header pins 2.54 apart, centred; their order reads the other way on the back.</text>
<text x="40.0" y="1061.0" font-size="14" text-anchor="start" fill="#333" font-weight="normal">Wired here: Vdd and GND to 3V3 and GND, Out to GPIO 21 (joined to GPIO 3), Gain to Vdd (40 dB), AR open.</text>
